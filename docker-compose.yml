version: '3.8'

services:
  # =========================================================================
  # 1. DATABASE SERVICE (PostgreSQL) - STRICTLY PRIVATE
  # =========================================================================
  db:
    image: postgres:15-alpine
    container_name: ecommerce_db
    restart: always
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_secure_password
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Port 5432 is NOT published to host; exposed internally within app-network only
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # 2. BACKEND SERVICE (FastAPI) - STRICTLY PRIVATE
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://shop_user:shop_secure_password@db:5432/ecommerce_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    # Port 8000 is NOT published to host; accessible only by Nginx reverse proxy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =========================================================================
  # 3. FRONTEND SERVICE (React + Nginx) - EXPOSED PUBLICLY ON PORT 80
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    restart: always
    ports:
      # Only port 80 is published to the host for public internet traffic
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# ===========================================================================
# VOLUMES & ISOLATED BRIDGE NETWORKS
# ===========================================================================
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
